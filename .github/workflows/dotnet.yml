name: Build

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build, test, and publish
        shell: pwsh
        run: .\scripts\Build.ps1 -Configuration Release

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: RadialCommandWheel-win-x64
          path: dist/RadialCommandWheel.exe
          if-no-files-found: error

      - name: Move nightly tag to this commit
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: pwsh
        run: |
          git tag --force Nightly $env:GITHUB_SHA
          git push --force origin refs/tags/Nightly

      - name: Create or update Nightly release
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Nightly
          target_commitish: ${{ github.sha }}
          name: Nightly
          body: |
            Automated nightly build from commit `${{ github.sha }}`.

            Branch: `${{ github.ref_name }}`
          prerelease: true
          draft: false
          make_latest: false
          files: dist/RadialCommandWheel.exe
          overwrite_files: true
          fail_on_unmatched_files: true
